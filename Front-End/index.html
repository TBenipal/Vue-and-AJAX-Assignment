<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, width=device-width">
    <title>Vue App</title>
    <link href="css/grid.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <script defer src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
  <header>
    <h1>Vue Application</h1>
    <p>This is the header it is not part of the app</p>
  </header>
      <!-- Where we place our app -->
  <section id="app">
    <section>
      <h2>Vehicles</h2>

      <!-- <button @click="fetchCar()">Load Cars</button> -->

      <ul>
        <li v-for="car in electricCars">
          <button type="button">
            {{ car.make }} {{ car.fuel }}
          </button>
        </li>

        <li v-for="car in petrolCars">
          <button type="button">
            {{ car.make }} {{ car.fuel }}
          </button>
        </li>
      </ul>
    </section>
  </section>
</body>
</html>
